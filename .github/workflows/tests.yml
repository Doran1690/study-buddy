name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # sentence-transformers is skipped: tests use a fake embedder.
      - run: pip install anthropic fastapi python-multipart pymupdf chromadb python-dotenv pytest httpx
      - run: pytest -q
